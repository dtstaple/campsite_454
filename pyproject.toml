[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
addopts = "-v --strict-markers -m 'not network' --cov --cov-report=term-missing --cov-report=xml"
markers = [
    "unit: fast isolated tests",
    "integration: tests requiring the database or external services",
    "network: hits a live third-party service; deselected by default so an upstream outage cannot turn CI red. Run with: pytest -m network",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/.venv/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Django generates migrations and re-generates them on schema changes, so they are
# not hand-maintained. Long lines there are copied help_text at deep indentation.
"*/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
# Our own Django apps, so they sort as first-party rather than third-party.
known-first-party = ["accounts", "api", "config", "geodata", "health", "pipeline"]
