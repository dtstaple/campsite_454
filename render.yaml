# Render Blueprint for CampSite (TM05-113). docs/deployment.md walks through using it.
# Every secret is either generated by Render or entered in the dashboard (sync: false);
# none is committed here.
databases:
  - name: campsite-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: campsite
    user: campsite

services:
  - type: web
    name: campsite-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campsite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: BEHIND_TLS_PROXY
        value: "True"
      # Render's proxy appends the client address to X-Forwarded-For.
      - key: THROTTLE_NUM_PROXIES
        value: "1"
      # The frontend's https://...onrender.com origin, entered after it is created.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: campsite-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Client-side routing: every path serves the single-page app.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the bundle at build time and public; never a secret.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MAP_STYLE_URL
        sync: false
