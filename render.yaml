# Render Blueprint for CampSite (TM05-113, production-ready in TM05-161). docs/deployment.md
# explains every service and variable, what each costs, and how to deploy, redeploy, refresh
# the data and roll back.
#
# No secret is committed here. Each secret is generated by Render (SECRET_KEY), wired from the
# database (DATABASE_URL), or entered in the dashboard when the Blueprint is applied
# (sync: false). Deploys are triggered by CI after it passes on main (the deploy job in
# .github/workflows/ci.yml calls each service's deploy hook), so Render's own auto-deploy on
# every push is off.
databases:
  - name: campsite-db
    # A paid plan: free databases expire after 30 days and have no backups. Basic-256mb has
    # point-in-time recovery. PostGIS is enabled by scripts/restore_production.sh.
    plan: basic-256mb
    diskSizeGB: 5 # the snapshot restores to about 1.2 GB; disk can grow later, never shrink
    postgresMajorVersion: "16"
    databaseName: campsite
    user: campsite

services:
  - type: web
    name: campsite-api
    runtime: docker
    # Starter, not free: free instances sleep after 15 idle minutes and cannot run a
    # pre-deploy command.
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Migrations run once per deploy, before the new version takes traffic. A failure stops
    # the deploy and the previous version keeps serving.
    preDeployCommand: python manage.py migrate --no-input
    healthCheckPath: /api/health/
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campsite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: BEHIND_TLS_PROXY
        value: "True"
      # Render's proxy appends the client address to X-Forwarded-For.
      - key: THROTTLE_NUM_PROXIES
        value: "1"
      # The pre-deploy command migrates; the image's start command need not.
      - key: MIGRATE_ON_START
        value: "False"
      # The frontend's https:// origin, entered when the Blueprint is applied.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: web
    name: campsite-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "off"
    headers:
      # Vite's bundles have content hashes in their names, so they can be cached for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html names the current bundles, so it is always revalidated.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Client-side routing: every path serves the single-page app.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the bundle at build time and public; never a secret.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_MAP_STYLE_URL
        sync: false
