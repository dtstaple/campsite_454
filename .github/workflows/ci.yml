name: CI

on: [push, pull_request]

jobs:
  quality:
    # Pinned: ubuntu-latest moved to 26.04, whose GEOS/PROJ put the stitched test route
    # on the other side of 4,000 m, so test_candidates counts 21 stations against 20.
    runs-on: ubuntu-24.04

    # The test suite talks to a real PostGIS database rather than mocking it, so the
    # spatial columns, GiST indexes, and unique constraints are verified for real.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: campsite
          POSTGRES_USER: campsite
          # Throwaway password for an ephemeral service container that only exists
          # for the duration of this job. Not a real credential.
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgis://campsite:ci-postgres@localhost:5432/campsite
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # GeoDjango loads these at import time. Ubuntu's GDAL is within the version
      # range Django probes for by name, so no GDAL_LIBRARY_PATH is needed here.
      - name: Install GDAL and GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libproj-dev gdal-bin libgdal-dev libgeos-dev
          gdal-config --version
          ldconfig -p | grep -E 'libgdal|libgeos_c' || true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests with coverage
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # The quality job above is Python-only, so a frontend file that does not compile
  # merges green -- which is exactly how a paint property referencing a token that
  # was never added reached main. `npm run build` runs `tsc -b` before Vite, so this
  # job is the type check as well as the build; there is no standalone typecheck
  # script to call instead. No database, so it runs in parallel with `quality`.
  frontend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # Node 22 strips TypeScript types itself, so the .ts tests run with no extra tooling.
      - name: Test
        run: npm test
        working-directory: frontend

  # TM05-161: deploy to Render only after both jobs above pass on a push to main. Each step
  # calls a Render deploy hook (a secret URL from the service's Settings -> Deploy Hook) and
  # is skipped while its secret is unset, so this job is a no-op until the secrets are added.
  # render.yaml turns Render's own auto-deploy off, so nothing deploys before CI is green.
  # docs/deployment.md, "Deploying".
  deploy:
    needs: [quality, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}

    steps:
      - name: Deploy the backend (campsite-api)
        if: env.API_HOOK != ''
        run: curl -fsS -X POST "$API_HOOK" > /dev/null && echo "backend deploy triggered"

      - name: Deploy the frontend (campsite-web)
        if: env.WEB_HOOK != ''
        run: curl -fsS -X POST "$WEB_HOOK" > /dev/null && echo "frontend deploy triggered"

      - name: Nothing to deploy
        if: env.API_HOOK == '' && env.WEB_HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK and RENDER_DEPLOY_HOOK_WEB are not set; skipping deploy."
