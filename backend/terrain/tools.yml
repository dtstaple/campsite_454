# Terrain tool registry (TM05-141). docs/terrain-analysis.md explains each choice.
#
# `make terrain REGION=<region>` runs every tool below over that region's DEM and writes
# two kinds of output, both derived (rasters are never stored in the database):
#
#   facts  per-campsite values (TerrainFacts.facts), sampled from a tool's raster
#   zones  classified polygons (TerrainZone), served as vector tiles
#
# Adding a tool: a `tools` entry here, and a mapper in terrain/mappers.py only if the
# output needs one that doesn't exist yet. See "Adding a terrain tool" in
# docs/terrain-analysis.md.

runtime:
  # The GeoLibre WASM runtime, fetched once and checked against this checksum
  # (the release's SHA256SUMS.txt). GEOLIBRE_WASM may point at a local copy instead.
  version: v1.7.1
  url: https://github.com/opengeos/geolibre-rust/releases/download/v1.7.1/geolibre-cli-v1.7.1.wasm
  sha256: 1bbd170210e1c25fc76f4edeccc68ea9ceb34fbf141cea48d68172fd4e34feca

dem:
  # USGS 3DEP 1/3 arc-second (about 10 m), 1x1 degree COG tiles from The National Map.
  name: USGS 3DEP 1/3 arc-second
  tile_url: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/{tile}/USGS_13_{tile}.tif
  nodata: -999999
  # Every grid is EPSG:5070 (METRIC_SRID), so tools measure in metres.
  srid: 5070

# A grid is a resolution and how the region is cut into tiles. `tile_cells` is the tile
# core in cells (about 25 M cells is the most one GeoLibre call can hold); `overlap_m` is
# added on every side and must be at least the widest neighbourhood a tool on the grid
# reads. No `tile_cells` means the whole region in one piece.
grids:
  hydrology:
    resolution_m: 45
  coarse:
    resolution_m: 30
    tile_cells: 3000
    overlap_m: 1500
  fine:
    resolution_m: 10
    tile_cells: 3000
    overlap_m: 1000
    # Only tiles with a campsite in their core: nothing on this grid makes zones.
    sites_only: true
  # TM05-148: wind exposure. fetch_analysis searches upwind until terrain rises against
  # the wind, so on flat ground (a big lake) it walks to the tile edge from every cell and
  # its cost grows with the cube of the tile width: 49 s for 1,000 x 1,000 flat cells, ~25
  # min at the coarse grid's tile size. Wind shelter is a landscape-scale effect (hundreds
  # of metres), so 90 m cells are fine for it and keep a worst-case tile near a minute.
  wind:
    resolution_m: 90
    tile_cells: 1000
    overlap_m: 1500

# TM05-148: values that differ by region (pipeline/regions.yml names), used in step
# arguments as {name}. A region not listed uses `default`. Changing one changes the
# registry digest, so the tiles that read it are recomputed on the next run.
regional:
  # The prevailing wind: the compass direction it blows FROM, in degrees clockwise from
  # north. docs/terrain-analysis.md ("Wind exposure") says where each value comes from.
  wind_from_deg:
    default: 270
    adirondacks: 270

# Each tool is a chain of GeoLibre calls on one grid. `{dem}` is the grid's DEM tile and
# `{<step>}` an earlier step's output; the last step's output is the tool's raster.
tools:
  wetness:
    grid: hydrology
    steps:
      - {id: filled, tool: fill_depressions, args: {dem: "{dem}"}}
      - {id: sca, tool: dinf_flow_accum, args: {input: "{filled}", out_type: sca}}
      - {id: slope, tool: slope, args: {input: "{dem}", units: degrees}}
      - {id: twi, tool: wetness_index, args: {sca: "{sca}", slope: "{slope}"}}
    facts:
      twi: {sample: median, radius_m: 30}
    zones:
      layer: pooling-risk
      classes:
        - {class: high, min: 12.5}
      min_area_m2: 20000
      simplify_m: 45

  sink:
    grid: fine
    steps:
      - {id: depth, tool: depth_in_sink, args: {dem: "{dem}", zero_background: true}}
    facts:
      sink_depth_m: {sample: max, radius_m: 15}

  slope:
    grid: fine
    steps:
      - {id: slope, tool: slope, args: {input: "{dem}", units: degrees}}
    facts:
      slope_deg: {sample: median, radius_m: 15}

  aspect:
    grid: fine
    steps:
      - {id: aspect, tool: aspect, args: {input: "{dem}"}}
    facts:
      aspect_deg: {sample: circular_mean, radius_m: 15}

  position:
    grid: coarse
    steps:
      # Deviation from mean elevation over a 33-cell (about 1 km) window: how many
      # standard deviations the ground stands above (+) or below (-) its surroundings.
      - {id: dev, tool: deviation_from_mean_elevation, args: {input: "{dem}", filter_size_x: 33, filter_size_y: 33}}
    facts:
      dev: {sample: median, radius_m: 30}
    zones:
      layer: exposure
      # The same threshold as a site's "exposed" class, so the map and the panel agree.
      classes:
        - {class: high, min: 1.0}
      min_area_m2: 50000
      simplify_m: 30

  # TM05-153: two zone layers only the potential-campsite search reads (planning/
  # candidates.yml), so a computed spot can be ranked on the same ground classes a
  # campsite gets. Not served as map tiles, and not used by scoring.
  shelter:
    grid: coarse
    steps:
      # The same deviation as `position`; this tool zones the low side of it.
      - {id: dev, tool: deviation_from_mean_elevation, args: {input: "{dem}", filter_size_x: 33, filter_size_y: 33}}
    zones:
      layer: sheltered
      # Below the surrounding terrain by as much as a "sheltered" site (classify, below).
      classes:
        - {class: sheltered, max: -0.75}
      min_area_m2: 50000
      simplify_m: 30

  damp:
    grid: hydrology
    steps:
      - {id: filled, tool: fill_depressions, args: {dem: "{dem}"}}
      - {id: sca, tool: dinf_flow_accum, args: {input: "{filled}", out_type: sca}}
      - {id: slope, tool: slope, args: {input: "{dem}", units: degrees}}
      - {id: twi, tool: wetness_index, args: {sca: "{sca}", slope: "{slope}"}}
    zones:
      layer: damp-ground
      # A site's "medium" pooling band on TWI; the high band is `pooling-risk`, which the
      # search already rejects.
      classes:
        - {class: medium, min: 10.0, max: 12.5}
      min_area_m2: 20000
      simplify_m: 45

  # TM05-147: cold-air pooling. On clear, calm nights air cooled by the ground runs
  # downhill and settles in the lowest ground around, so a hollow or valley floor can be
  # several degrees colder (and frostier, and damper with dew) than a bench 30 m above it.
  # Elevation percentile over the same ~1 km window as `position`: the share of the
  # surrounding ground that is lower than the site (0 = the lowest cell around).
  cold_air:
    grid: coarse
    steps:
      - {id: rank, tool: elevation_percentile, args: {input: "{dem}", filter_size_x: 33, filter_size_y: 33}}
    facts:
      elev_percentile: {sample: median, radius_m: 30}
    zones:
      # planning/candidates.yml ranks potential campsites on this layer by name.
      layer: cold-air
      # The same thresholds as a site's cold-air class (classify, below), so the map and
      # the panel agree.
      classes:
        - {class: high, max: 10.0}
        - {class: medium, min: 10.0, max: 25.0}
      min_area_m2: 20000
      simplify_m: 30

  # TM05-148: exposure to the region's prevailing wind. fetch_analysis gives each cell the
  # distance upwind (towards `wind_from_deg`) to the first ground that rises against the
  # wind by more than `hgt_inc` (5%, about 3 degrees) above it. A short distance means a
  # ridge or valley wall breaks the wind; negative means nothing rose before the DEM ended
  # (minus the distance searched), which is open ground.
  wind:
    grid: wind
    steps:
      - {id: fetch, tool: fetch_analysis, args: {input: "{dem}", azimuth: "{wind_from_deg}", hgt_inc: 0.05}}
    facts:
      wind_fetch_m: {sample: median, radius_m: 90}
    zones:
      # planning/candidates.yml ranks potential campsites on this layer by name.
      layer: wind-exposure
      # The same distances as a site's wind class (classify, below). Nothing rising within
      # the search (negative) and 1 km or more of open ground upwind are both `exposed`.
      # Sheltered ground isn't zoned: the ranking only reads moderate and exposed.
      classes:
        - {class: exposed, max: 0.0}
        - {class: moderate, min: 300.0, max: 1000.0}
        - {class: exposed, min: 1000.0}
      min_area_m2: 50000
      simplify_m: 90

  viewshed:
    grid: coarse
    # One viewshed per campsite on a window around it, not a tiled raster.
    per_site:
      radius_m: 10000
      eye_height_m: 1.7
    facts:
      view: {mapper: viewshed}

# Classes built from the facts above, shown in the app and used by scoring.
classify:
  pooling:
    # High: low ground water drains into, or a hollow that water also drains into.
    # A hollow alone is medium (terrain/mappers.py says why).
    sink_depth_m: {high: 0.3, medium: 0.1}
    twi: {high: 12.5, medium: 10.0}
    sink_high_needs_twi: 10.0
  sun:
    # Below this slope the ground faces nowhere in particular.
    flat_below_deg: 4
    # 8 sectors, clockwise from north.
    sectors:
      - {facing: north, sun: little direct sun}
      - {facing: northeast, sun: early morning sun}
      - {facing: east, sun: morning sun}
      - {facing: southeast, sun: morning and midday sun}
      - {facing: south, sun: sun most of the day}
      - {facing: southwest, sun: afternoon sun}
      - {facing: west, sun: afternoon and evening sun}
      - {facing: northwest, sun: evening sun}
  shelter:
    # On `dev`, standard deviations above the surrounding terrain.
    exposed_from: 1.0
    sheltered_below: -0.75
  wind:
    # On `wind_fetch_m`, metres upwind to the first ground rising against the wind.
    # Sheltered: it rises within 300 m; exposed: 1 km or more of open ground upwind.
    sheltered_within_m: 300.0
    exposed_from_m: 1000.0
  cold_air:
    # On `elev_percentile`, the share (%) of the ground within ~1 km lower than the site.
    # High: in the lowest tenth, where cold air settles; medium: the lowest quarter.
    high_below: 10.0
    medium_below: 25.0
  view:
    # Visible cells within this distance of the site don't count towards its direction.
    near_m: 200
    # A single direction is named only when it holds this share of the visible area.
    direction_share: 0.3
    # Water is "in view" when at least this much lake or pond is visible within
    # `water_within_m` of the site: a glimpse of a lake 9 km off doesn't count.
    water_within_m: 2000
    water_min_m2: 10000
