# Routing settings (TM05-119, TM05-137). docs/routing.md explains each one.
#
# Changing a build setting takes effect on the next `build_trail_graph`; changing a
# snapping setting takes effect on the next request.

build:
  # Elevation sample spacing along every edge, metres.
  sample_spacing_m: 50
  # Near-miss gaps: a trail's loose end this close to another trail (or two trails that
  # cross) is joined with a "bridged" edge, though OSM gives them no shared node.
  bridge_tolerance_m: 15
  # Ways tagged like this are never joined where they cross: they pass over or under.
  no_crossing_tags: [bridge, tunnel, layer]

elevation_check:
  # `compare_graph_elevation` (TM05-149): how far the cached 3DEP mosaic may differ from
  # the getSamples elevations of the current graph. getSamples serves 1 m LiDAR where it
  # has it and the mosaic is 1/3 arc-second (~10 m), so the two are not identical.
  # Per sample |difference|, metres: median and 95th percentile.
  sample_median_m: 1.5
  sample_p95_m: 5
  # The region's total edge ascent, percent.
  total_ascent_pct: 5
  # Naismith time of seeded random trips, 95th percentile, percent.
  trip_time_p95_pct: 3

connectors:
  # Roads and sidewalks (geodata.Connector) are kept only this far, by road, from the
  # trail network, so a road walk between two trails is at most about twice this.
  max_from_trail_m: 1000
  # Cost multiplier on a road walk: a route leaves trail only when that saves enough.
  cost_factor: 1.5

snapping:
  # How far a click may be from a trail, metres.
  radius_m: 1000
  # Nearby edges considered per click when choosing the connected piece of the network.
  candidates: 40
  # A piece of the network with less trail than this is a fragment (a few paths round a
  # lodge, say). Snapping to one costs this many extra metres, so a main-network trail
  # nearby wins.
  fragment_max_km: 2
  fragment_penalty_m: 300

access:
  # TM05-171: how hard a campsite is to reach, walking from the nearest reachable
  # trailhead over this graph by Naismith time. `make data` / `make refresh` store it per
  # campsite (`compute_access <region>`); docs/routing.md, "Access difficulty".
  #
  # A site is the first class whose every limit it is within; past "moderate" it is hard.
  classes:
    easy:
      distance_km: 3
      gain_m: 200
      time_h: 1
    moderate:
      distance_km: 10
      gain_m: 600
      time_h: 3.5
  # A trailhead joins the graph at its nearest node this close, metres; one further
  # from every trail is not used.
  trailhead_max_m: 300
  # A campsite joins at its nearest node this close. The straight line from that node to
  # the site is added to the distance as flat walking. Further than this, access is
  # unknown.
  campsite_max_m: 500
