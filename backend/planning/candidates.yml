# Potential campsites along a trail (TM05-99). docs/candidates.md explains every value.
# Tuning one is an edit here; every value is part of the cache key, so cached searches
# from an old config are not reused.

# Sample stations every this many metres along the trail's stitched line.
sample_spacing_m: 200
# At each station, points this far to each side of the line. Only offsets inside the
# user's corridor (the trail panel's "within") are used.
offsets_m: [60, 120, 200, 300, 450, 700, 1000]

# Hard filters: a candidate must pass every one.
# NY State Land Camping Rules: a non-designated site must be at least 150 ft (45.72 m)
# from any road, trail, spring, stream, pond or other body of water.
rule_distance_m: 45.72
# Gentle ground. The slope factor's curve (scoring/config.yml) is ideal to 3 degrees and
# halves by 8; 5 degrees keeps candidates where a tent pitches comfortably.
max_slope_deg: 5
# TM05-143: skip points inside a high water pooling risk zone (make terrain). Only where
# the terrain pipeline has run; elsewhere each candidate says it wasn't checked.
reject_pooling_risk: true
# Ground slope is measured on a 3x3 stencil this far apart, as for campsites (TM05-64).
stencil_m: 10

# Keeping the best: highest score first, at least this far apart along the trail
# (about 0.5 mi), at most this many.
min_spacing_m: 805
max_results: 8
# Scoring is the slow step, so only the flattest survivor at each station is scored, and
# at most this many of those, evenly spread along the trail.
max_scored: 60

# TM05-153: rank the spots that passed every filter above on their terrain, so the search
# prefers sheltered, dry, gentle ground, with a view when it can. Ranking only reorders
# survivors; it can never bring back a point a filter removed.
#
# Each factor reads one terrain zone layer (`make terrain`, terrain/tools.yml). A point
# inside a zone of a listed class gets `weight` x that class's value added to its 0-100
# score; outside every zone it gets nothing. A layer the region doesn't have yet counts
# as not available: no points either way, and no reason shown.
ranking:
  factors:
    shelter:
      layer: sheltered
      weight: 8
      classes: {sheltered: 1.0}
      reasons: {sheltered: "Sheltered: lower than the ground around it"}
    exposure:
      layer: exposure
      weight: 8
      classes: {high: -1.0}
      reasons: {high: "Exposed: stands above the ground around it"}
    damp:
      layer: damp-ground
      weight: 8
      classes: {medium: -1.0}
      reasons: {medium: "Damp ground: water collects nearby"}
    # TM05-147 (cold-air pooling) and TM05-148 (wind exposure) add these layers; until a
    # run writes them they are not available and change nothing.
    cold_air:
      layer: cold-air
      weight: 8
      classes: {high: -1.0, medium: -0.5}
      reasons: {high: "Frost hollow: cold air pools here", medium: "Some cold-air pooling"}
    wind:
      layer: wind-exposure
      weight: 6
      classes: {exposed: -1.0, moderate: -0.3}
      reasons: {exposed: "Open to the prevailing wind", moderate: "Partly open to the prevailing wind"}
    # High ground sees farther: the same exposure zone, as a likely view.
    view:
      layer: exposure
      weight: 3
      classes: {high: 1.0}
      reasons: {high: "High ground: likely a view"}
