# How named routes are described to a user (TM05-82, TM05-73). docs/routes.md explains
# every value. Tuning one is an edit here, not a code change.

difficulty:
  # Shenandoah National Park's hiking rating: sqrt(gain_ft * 2 * distance_mi), on the route
  # as mapped (one way). A route takes the first band whose `below` it is under; the last
  # band has no upper bound. Shenandoah's own five bands (50 / 100 / 150 / 200) are folded
  # into three: its "moderately strenuous" (100-150) counts as Moderate here.
  bands:
    - { label: Easy, below: 50 }
    - { label: Moderate, below: 150 }
    - { label: Hard, below: null }

route_type:
  # Start and end of the stitched line within this many metres: a loop. Measured, not
  # estimated.
  loop_max_gap_m: 200
  # Another trail (not one of the route's own ways) within this of an end: that end
  # connects onward.
  connect_m: 30
  # A lake or pond within this of an end: the end is at a pond.
  pond_m: 100
  # An end within this many metres (vertical) of the route's highest point: a summit --
  # but only if the route climbs at least summit_min_relief_m to get there, so a flat
  # route's ends are not "summits".
  summit_within_m: 15
  summit_min_relief_m: 100

along:
  # TM05-73. A campsite whose nearest point on the route is one of its ends, and that is
  # farther than this from it, is past the end: it is labelled "near the trailhead" or
  # "near the trail's end" rather than given mile 0 or the last mile, which it is not at.
  off_end_m: 100
  # The nearest point counts as "at the end" within this many metres of it along the line:
  # a route's first or last segment is rarely straight, so a site off the end projects a
  # few metres onto the line, not exactly onto the end vertex.
  end_zone_m: 50

assembly:
  # TM05-98. When a named trail is assembled from its mapped segments (TM05-97), two pieces
  # with the same name are joined through unnamed ways -- a bridge, a road crossing, a
  # junction stub -- whose combined length is at most this. The connectors must share OSM
  # nodes with both pieces; a gap is never bridged through a named way. 0 turns it off.
  connector_max_m: 300
